<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glowIndigo" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Card & Element Gradients -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-window" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="glow-badge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="800" height="480" fill="url(#glowIndigo)" />
  <rect width="800" height="480" fill="url(#glowCyan)" />
  <rect width="800" height="480" fill="url(#glowPink)" />

  <!-- Subtle Modern Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Floating Decorative Friendly Sparkles & Shapes -->
  <!-- Top Left Sparkle -->
  <path d="M 90 75 Q 90 90 75 90 Q 90 90 90 105 Q 90 90 105 90 Q 90 90 90 75 Z" fill="#60a5fa" opacity="0.85" />
  <circle cx="130" cy="65" r="3" fill="#a78bfa" opacity="0.6" />
  <circle cx="680" cy="95" r="4" fill="#38bdf8" opacity="0.7" />
  <!-- Top Right Sparkle -->
  <path d="M 710 130 Q 710 142 698 142 Q 710 142 710 154 Q 710 142 722 142 Q 710 142 710 130 Z" fill="#38bdf8" opacity="0.8" />
  <!-- Bottom Friendly Sparkle -->
  <path d="M 120 380 Q 120 390 110 390 Q 120 390 120 400 Q 120 390 130 390 Q 120 390 120 380 Z" fill="#f472b6" opacity="0.7" />
  <circle cx="690" cy="385" r="5" fill="#818cf8" opacity="0.5" />

  <!-- Main Friendly Browser / App Window Mockup -->
  <g filter="url(#shadow-window)">
    <!-- Window Outer Shell -->
    <rect x="130" y="55" width="540" height="360" rx="16" fill="url(#windowBg)" stroke="url(#windowBorder)" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <path d="M 130 71 A 16 16 0 0 1 146 55 L 654 55 A 16 16 0 0 1 670 71 L 670 100 L 130 100 Z" fill="#1e293b" fill-opacity="0.6" />
    <line x1="130" y1="100" x2="670" y2="100" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />

    <!-- Traffic Light Buttons -->
    <circle cx="160" cy="78" r="6" fill="#f43f5e" />
    <circle cx="180" cy="78" r="6" fill="#f59e0b" />
    <circle cx="200" cy="78" r="6" fill="#10b981" />

    <!-- Search / URL Pill -->
    <rect x="240" y="68" width="280" height="20" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <!-- Lock / Globe Icon -->
    <circle cx="254" cy="78" r="3.5" fill="#38bdf8" opacity="0.8" />
    <!-- URL Text Line -->
    <rect x="266" y="76" width="100" height="4" rx="2" fill="#94a3b8" opacity="0.6" />
    <rect x="372" y="76" width="40" height="4" rx="2" fill="#38bdf8" opacity="0.5" />

    <!-- Window Body Content -->
    <!-- Left Navigation Bar -->
    <g opacity="0.85">
      <rect x="150" y="120" width="80" height="8" rx="4" fill="url(#cyanPill)" opacity="0.9" />
      <rect x="150" y="142" width="60" height="6" rx="3" fill="#64748b" opacity="0.6" />
      <rect x="150" y="160" width="70" height="6" rx="3" fill="#64748b" opacity="0.4" />
      <rect x="150" y="178" width="50" height="6" rx="3" fill="#64748b" opacity="0.4" />
      <rect x="150" y="196" width="65" height="6" rx="3" fill="#64748b" opacity="0.4" />

      <!-- Mini Friendly Status Avatar in Sidebar -->
      <circle cx="162" cy="375" r="12" fill="url(#accentPill)" />
      <!-- Smile icon inside avatar -->
      <path d="M 158 376 Q 162 380 166 376" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <circle cx="159.5" cy="372.5" r="1" fill="#ffffff" />
      <circle cx="164.5" cy="372.5" r="1" fill="#ffffff" />
      <rect x="182" y="372" width="45" height="6" rx="3" fill="#94a3b8" opacity="0.7" />
    </g>

    <!-- Vertical Divider -->
    <line x1="245" y1="100" x2="245" y2="415" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

    <!-- Main Content Area -->
    <!-- Hero / Feature Banner Card -->
    <g filter="url(#shadow-card)">
      <rect x="265" y="120" width="380" height="120" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.4" stroke-width="1" />
      
      <!-- Banner Internal Highlights -->
      <!-- Friendly Chip -->
      <rect x="285" y="138" width="72" height="18" rx="9" fill="url(#cyanPill)" fill-opacity="0.25" stroke="#06b6d4" stroke-width="0.8" />
      <text x="321" y="150.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE APP</text>

      <!-- Main Headline Bars -->
      <rect x="285" y="168" width="180" height="12" rx="6" fill="#f8fafc" opacity="0.95" />
      <rect x="285" y="188" width="220" height="8" rx="4" fill="#94a3b8" opacity="0.75" />
      <rect x="285" y="202" width="150" height="8" rx="4" fill="#94a3b8" opacity="0.5" />

      <!-- Interactive Button Pill -->
      <rect x="285" y="222" width="90" height="24" rx="12" fill="url(#accentPill)" />
      <!-- Play/Arrow Icon -->
      <polygon points="318,230 318,238 325,234" fill="#ffffff" />
      <rect x="332" y="232" width="30" height="4" rx="2" fill="#ffffff" opacity="0.9" />

      <!-- Friendly Graphic Element on right of banner -->
      <circle cx="585" cy="180" r="36" fill="url(#accentPill)" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="585" cy="180" r="24" fill="url(#cyanPill)" opacity="0.85" />
      <!-- Code Brackets in Circle </> -->
      <path d="M 577 175 L 572 180 L 577 185" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 593 175 L 598 180 L 593 185" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="587" y1="174" x2="583" y2="186" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Two Lower Friendly UI Cards -->
    <!-- Card 1: Metrics / Progress -->
    <g filter="url(#shadow-card)">
      <rect x="265" y="258" width="180" height="135" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.35" stroke-width="1" />
      
      <circle cx="287" cy="282" r="10" fill="#3b82f6" fill-opacity="0.2" />
      <path d="M 284 282 L 286 284 L 290 279" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <rect x="306" y="278" width="70" height="8" rx="4" fill="#e2e8f0" opacity="0.9" />
      
      <!-- Mini Chart / Wave -->
      <path d="M 285 345 Q 310 320 335 335 T 385 305 T 425 315" fill="none" stroke="url(#cyanPill)" stroke-width="3" stroke-linecap="round" />
      <path d="M 285 345 Q 310 320 335 335 T 385 305 T 425 315 L 425 365 L 285 365 Z" fill="url(#cyanPill)" fill-opacity="0.1" />
      
      <rect x="285" y="375" width="45" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
      <rect x="390" y="375" width="35" height="5" rx="2.5" fill="#10b981" opacity="0.8" />
    </g>

    <!-- Card 2: Code / Components List -->
    <g filter="url(#shadow-card)">
      <rect x="460" y="258" width="185" height="135" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-opacity="0.35" stroke-width="1" />
      
      <!-- Header with Tag -->
      <rect x="480" y="276" width="60" height="7" rx="3.5" fill="#f8fafc" opacity="0.9" />
      <circle cx="625" cy="280" r="3" fill="#10b981" />
      
      <!-- Code lines mockup -->
      <rect x="480" y="298" width="90" height="6" rx="3" fill="#a78bfa" opacity="0.8" />
      <rect x="576" y="298" width="45" height="6" rx="3" fill="#38bdf8" opacity="0.7" />

      <rect x="495" y="314" width="70" height="6" rx="3" fill="#f472b6" opacity="0.75" />
      <rect x="572" y="314" width="30" height="6" rx="3" fill="#94a3b8" opacity="0.5" />

      <rect x="495" y="330" width="110" height="6" rx="3" fill="#38bdf8" opacity="0.75" />

      <rect x="480" y="346" width="55" height="6" rx="3" fill="#a78bfa" opacity="0.8" />

      <!-- Friendly status badge -->
      <rect x="480" y="368" width="80" height="16" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8" />
      <text x="520" y="379" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">✓ PRODUCTION</text>
    </g>
  </g>

  <!-- Floating Floating Friendly Badge (Top Right of Window) -->
  <g filter="url(#glow-badge)">
    <rect x="620" y="40" width="75" height="32" rx="16" fill="url(#accentPill)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <!-- Sparkle Icon -->
    <path d="M 638 51 Q 638 56 633 56 Q 638 56 638 61 Q 638 56 643 56 Q 638 56 638 51 Z" fill="#ffffff" />
    <text x="664" y="60.5" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NEW</text>
  </g>
</svg>
