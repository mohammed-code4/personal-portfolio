<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohammed Hussein | Front-End Developer</title>
    <meta
      name="description"
      content="Mohammed Hussein - Front-End Developer Portfolio. Specialized in React, Next.js, and TypeScript."
    />
    <script>
      (function() {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light") {
          document.documentElement.classList.remove("dark");
        } else if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        } else if (!window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/pages/main.tsx"></script>
  </body>
</html>
